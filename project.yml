name: XiaoFeiYu
options:
  bundleIdPrefix: com.xiaofeiyu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Release-Shared: release
  Release-Clean: release

targets:
  XiaoFeiYu:
    type: application
    platform: iOS
    sources:
      - path: XiaoFeiYu
    info:
      path: XiaoFeiYu/Info.plist
      properties:
        CFBundleDisplayName: 小肥鱼下载器
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 保存视频、图片、实况照片到相册
        NSPhotoLibraryUsageDescription: 读取相册以保存媒体
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaofeiyu.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
      configs:
        Release-Shared:
          PRODUCT_BUNDLE_IDENTIFIER: com.xiaofeiyu.app.shared
          MARKETING_VERSION: "1.12.0"
          CURRENT_PROJECT_VERSION: "11200"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARED_VERSION"
        Release-Clean:
          PRODUCT_BUNDLE_IDENTIFIER: com.xiaofeiyu.app.clean
          MARKETING_VERSION: "2.0.0"
          CURRENT_PROJECT_VERSION: "20000"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

schemes:
  XiaoFeiYu:
    build:
      targets:
        XiaoFeiYu: all
    run:
      config: Debug
