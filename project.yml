name: XiaoFeiYu
options:
  bundleIdPrefix: com.xiaofeiyu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  XiaoFeiYu:
    type: application
    platform: iOS
    sources:
      - path: XiaoFeiYu
    info:
      path: XiaoFeiYu/Info.plist
      properties:
        CFBundleDisplayName: 小肥鱼下载器
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 保存视频、图片、实况照片到相册
        NSPhotoLibraryUsageDescription: 读取相册以保存媒体
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaofeiyu.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""

schemes:
  XiaoFeiYu:
    build:
      targets:
        XiaoFeiYu: all
    run:
      config: Debug
