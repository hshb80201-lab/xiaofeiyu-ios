name: Build iOS unsigned IPAs (Shared + Clean)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-source.zip"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.flavor }}
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release-Shared
            flavor: Shared
            artifact: xiaofeiyu-shared-ipa
          - config: Release-Clean
            flavor: Clean
            artifact: xiaofeiyu-clean-ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip iOS source
        run: |
          set -e
          if [ -f ios-source.zip ]; then
            unzip -q -o ios-source.zip -d .
          fi
          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ${{ matrix.flavor }} unsigned .app
        env:
          CONFIG: ${{ matrix.config }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -e
          xcodebuild \
            -project XiaoFeiYu.xcodeproj \
            -scheme XiaoFeiYu \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP=$(find build/Build/Products -type d -name "XiaoFeiYu.app" | head -1)
          test -d "$APP"
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          lipo -info "$APP/XiaoFeiYu" || true

      - name: Package ${{ matrix.flavor }} unsigned IPA
        env:
          CONFIG: ${{ matrix.config }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -e
          APP=$(find build/Build/Products -type d -name "XiaoFeiYu.app" | head -1)
          rm -rf Payload "XiaoFeiYu-${FLAVOR}-unsigned.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -q -r -0 "XiaoFeiYu-${FLAVOR}-unsigned.ipa" Payload
          unzip -l "XiaoFeiYu-${FLAVOR}-unsigned.ipa" | head -20

      - name: Upload ${{ matrix.flavor }} IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: XiaoFeiYu-${{ matrix.flavor }}-unsigned.ipa
          if-no-files-found: error
